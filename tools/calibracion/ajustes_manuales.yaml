# Ajustes manuales del diccionario ROS. calibrar.py los aplica DESPUÉS de la calibración automática,
# así que sobreviven a cada recalibración. Cada entrada debe documentar su evidencia.
#
# Formato: <número ROS>: { const, nombre, tipos_objeto, confianza: manual, evidencia, [semantica] }

521:
  const: DML_DAT_NAM
  nombre: Nombre Destino de Datos DML
  tipos_objeto: [7]
  confianza: manual
  semantica: "vacío = el destino DML es el mismo origen de datos de consulta (QRY_DAT_SRC_NAM, ROS 522)"
  evidencia: >
    STKC007: BDETA graba 'STKC007' y la API devuelve DML_DAT_NAM='STKC007'. BDOCU graba '' y la API
    devuelve DML_DAT_NAM='"ADRE"."STK_DOCUMENTO"', que es su QRY_DAT_SRC_NAM. La calibración automática
    no lo puede ver porque el valor grabado ('') difiere del valor efectivo que informa la API.

754:
  const: PARAM_INIT_VAL_NORMALIZADO
  nombre: Valor inicial del parámetro normalizado (interno)
  tipos_objeto: [24]
  confianza: manual
  semantica: "copia interna de PARAM_INIT_VAL (ROS 116) en formato canónico; usar 116"
  evidencia: "P_FEC_INIC_SISTEMA: 116='01/04/1997', 754='01-04- 1997 00:00:00'; P_EMPRESA: 116='1', 754='1'."

465:
  const: LONGITUD_CODIGO
  nombre: Longitud del binario de código (interno)
  tipos_objeto: [42, 58, 68]
  confianza: manual
  semantica: "longitud en bytes del BLONG de la propiedad 464; no aporta al análisis"
  evidencia: "ON-CLEAR-DETAILS: 465=885 y el binario 464 mide 888 bytes (885 + relleno); igual en todos los triggers."

577:
  const: REFERENCIAS_COMPILADAS
  nombre: Lista de referencias cruzadas compiladas (interno)
  tipos_objeto: [22]
  confianza: manual
  semantica: >
    apunta a la lista de objetos tipo 100 ('BLOQUE.ITEM' / 'PARAMETER.X'), cuyos hijos tipo 19 nombran
    las unidades de código que los usan (program units por nombre, triggers por nombre interno)
  evidencia: "STKC007: 577 -> nodo 491 (tipo 101) con 122 hijos tipo 100, p. ej. 'PARAMETER.P_DOCU_CLAVE'."
