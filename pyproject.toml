[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forms2apex"
version = "0.1.0"
description = "Analiza módulos Oracle Forms 6i (.fmt/.mmt/.pld) y genera documentación para migrarlos a Oracle APEX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forms2apex = "forms2apex.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forms2apex = ["render/plantillas/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
